name: CI

on:
  # No branch filter: this repo does its work directly on a single non-main
  # branch (claude/magical-bell-6SZ0m), not main. A `branches: [main]` filter
  # here was a silent no-op — every push to the real working branch skipped
  # CI entirely, so build/type-check regressions only ever surfaced in
  # production. Pull requests still get their own run below.
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Dependency vulnerability audit (high/critical only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # tracked, not blocking yet — see SECURITY.md

      - name: Build
        run: npm run build
        env:
          # Placeholder values — the build only needs these to be present.
          # Real secrets live in Vercel project settings, never in the repo.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
